name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: pytest tests/ -v
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
